<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#150E13">
  <meta name="description" content="Calendario de adviento de 31 días con recuerdos: abre una cajita cada día de diciembre y descubre el objeto y la historia que hay detrás.">
  <title>31 días, 31 recuerdos — Calendario de Adviento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;0,900;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>

  <div class="nieve" id="nieve" aria-hidden="true"></div>

  <main class="contenedor">
    <header class="header">
      <div class="adorno" aria-hidden="true"><span></span><i></i><span></span></div>

      <p class="kicker">Calendario de adviento, diciembre 2026</p>
      <h1>31 días, <em>31 recuerdos</em></h1>
      <p class="subtitulo">Abre una cajita cada día. Dentro te espera un objeto, un instante y una historia que compartimos.</p>

      <div class="estado-fecha" id="estado-fecha" role="status" aria-live="polite">
        Día <span id="dia-actual">--</span> de 31
      </div>

      <div class="progreso-wrap">
        <div class="progreso" role="progressbar" aria-label="Cajitas abiertas" aria-valuemin="0" aria-valuemax="31" aria-valuenow="0" id="progreso">
          <span id="progreso-barra"></span>
        </div>
        <p class="progreso-texto" id="progreso-texto">0 de 31 cajitas abiertas</p>
      </div>
    </header>

    <div class="calendario-grid" id="calendario">
      <!-- Las cajas se generan con JavaScript -->
    </div>
  </main>

  <!-- Modal de recuerdo abierto -->
  <div class="modal-fondo" id="modal-fondo" role="dialog" aria-modal="true" aria-labelledby="titulo-modal">
    <div class="modal">
      <button class="cerrar-modal" id="cerrar-modal" type="button" aria-label="Cerrar recuerdo">×</button>
      <div class="contenido-modal" id="contenido-modal">
        <!-- Se inyecta con JS -->
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>Hecho por Charlie con mucho amor <span class="corazon">❤️</span></p>
  </footer>

  <script src="datos.js?v=7"></script>
  <script src="script.js?v=7"></script>
</body>
</html>
